<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Ascot Corp Dev Tracker</title>
<style>
/* Layout: Ascot template chrome (spectrum stripe, magenta action title, navy text, footer) over a tabbed app with a side drawer. */
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --tile:#EEEEF5; --alt:#F5F5FA; --grid:#D9DCE6;
  --ink:#262166; --muted:#666666; --magenta:#EB008C; --blue:#00539E; --lblue:#0081C3;
  --teal:#00857C; --purple:#944599; --head:#262166; --headInk:#FFFFFF;
  --overlay:rgba(38,33,102,.28); --shadow:0 12px 40px rgba(38,33,102,.18);
  --font:Arial,"Helvetica Neue",Helvetica,sans-serif;
}
:root,:root[data-theme]{color-scheme:light}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);margin:0}
body{color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue)}
:focus-visible{outline:2px solid var(--magenta);outline-offset:2px}
.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}

/* Template chrome */
.stripe{display:flex;height:6px}
.stripe i{flex:1}
.stripe i:nth-child(1){background:#262166}.stripe i:nth-child(2){background:#944599}
.stripe i:nth-child(3){background:#EB008C}.stripe i:nth-child(4){background:#0081C3}
.stripe i:nth-child(5){background:#00539E}.stripe i:nth-child(6){background:#00857C}
.wrap{max-width:1320px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{border-bottom:1px solid var(--grid);background:var(--surface)}
.top .wrap{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 24px;padding-block:14px 0}
.brand{flex:1 1 320px;min-width:0;padding-bottom:12px}
.kicker{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink);font-weight:bold}
.brand h1{margin:2px 0 0;font-size:24px;color:var(--magenta);font-weight:normal;text-wrap:balance}
.who{position:relative;display:flex;align-items:center;gap:10px;padding-bottom:12px;font-size:13px}
.dot{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:12px;font-weight:bold;background:var(--blue);border:0;padding:0;cursor:pointer;font-family:inherit}
.whomenu{position:absolute;right:0;top:calc(100% - 4px);z-index:30;min-width:220px;background:var(--surface);border:1px solid var(--grid);box-shadow:var(--shadow);display:flex;flex-direction:column;padding:6px 0}
.whomenu .wm-n{padding:8px 14px 10px;border-bottom:1px solid var(--grid);margin-bottom:4px}
.whomenu .wm-n b{display:block}.whomenu .wm-n span{font-size:12px;color:var(--muted)}
.whomenu button{all:unset;cursor:pointer;padding:9px 14px;font-weight:bold;font-size:13px}
.whomenu button:hover,.whomenu button:focus-visible{background:var(--tile)}
nav.tabs{display:flex;gap:4px;flex-basis:100%;overflow-x:auto}
nav.tabs a{padding:10px 16px;text-decoration:none;color:var(--ink);border-bottom:3px solid transparent;font-weight:bold;white-space:nowrap}
nav.tabs a[aria-current="page"]{border-bottom-color:var(--magenta);color:var(--magenta)}
nav.tabs a:hover{background:var(--alt)}
nav.tabs .ntag{font-weight:normal;font-size:11px;color:var(--muted);margin-left:6px}
main .wrap{padding-block:22px 28px;display:flex;flex-direction:column;gap:26px}
footer.foot{border-top:1px solid var(--grid)}
footer.foot .wrap{display:flex;justify-content:space-between;gap:12px;padding-block:10px;font-size:11px;color:var(--muted)}

/* Type */
.action-title{font-size:22px;color:var(--magenta);margin:0;text-wrap:balance}
.sub{margin:4px 0 0;color:var(--ink)}
.sec{display:flex;align-items:center;gap:12px;margin:0 0 12px;font-size:14px;font-weight:bold;color:var(--ink)}
.sec::before,.sec::after{content:"";flex:1;height:1px;background:var(--ink);opacity:.6}
.sec .n{font-weight:normal;color:var(--muted)}
.source{font-size:11px;font-style:italic;color:var(--muted);margin:0}
.banner{background:var(--tile);border-left:4px solid var(--magenta);padding:10px 14px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between}
.pagehead{display:flex;flex-wrap:wrap;gap:10px 24px;align-items:flex-start;justify-content:space-between}
.pagehead>div:first-child{flex:1 1 420px;min-width:0}
.headacts{display:flex;gap:8px;flex-wrap:wrap}

/* Tiles */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.tile{background:var(--tile);padding:16px 18px;min-width:0}
.tile b{display:block;font-size:28px;line-height:1.1;font-variant-numeric:tabular-nums}
.tile span{display:block;font-size:12px;margin-top:6px}
.tile small{display:block;font-size:11px;color:var(--muted);margin-top:2px}
.c-navy{color:var(--ink)}.c-mag{color:var(--magenta)}.c-blue{color:var(--blue)}.c-teal{color:var(--teal)}.c-purple{color:var(--purple)}
.cols{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:28px}
.cols>*{min-width:0}
@media (max-width:900px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.cols{grid-template-columns:1fr}}

/* Lists */
.mlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.mlist li{display:grid;grid-template-columns:64px minmax(0,1fr);gap:10px;padding:9px 0;border-bottom:1px solid var(--grid)}
.mlist .d{font-size:12px;font-weight:bold;font-variant-numeric:tabular-nums}
.mlist p{margin:0}
.mlist .meta{font-size:12px;color:var(--muted)}
.mlist.hist li{grid-template-columns:118px minmax(0,1fr)}
.mlist.hist .d{font-weight:normal;color:var(--muted)}
.mlist.hist p{font-size:13px}
.mlist li.click{cursor:pointer}
.mlist li.click:hover p b{color:var(--magenta)}

/* To-do rows */
.todos{list-style:none;margin:0;padding:0}
/* Calendar */
.calhead{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.calhead h3{margin:0 8px 0 0;font-size:20px;color:var(--ink);min-width:170px}
.calgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-left:1px solid var(--grid);border-top:1px solid var(--grid)}
.calgrid .dow{background:var(--head);color:var(--headInk);font-size:12px;font-weight:bold;padding:6px 8px}
.calgrid .day{min-height:104px;border-right:1px solid var(--grid);border-bottom:1px solid var(--grid);padding:4px;display:flex;flex-direction:column;gap:3px;min-width:0}
.calgrid .day.out{background:var(--alt)}.calgrid .day.out .dn{color:var(--muted)}
.calgrid .day.today{box-shadow:inset 0 0 0 2px var(--magenta)}
.calgrid .day.wkend{background:#FAFAFD}
.calgrid .dn{font-size:12px;font-weight:bold;padding:1px 3px}
.ev{display:block;width:100%;text-align:left;border:0;border-left:3px solid currentColor;background:var(--tile);color:var(--ink);font:inherit;font-size:11.5px;line-height:1.3;padding:2px 5px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev:hover{background:#E4E4EF}
.ev.cont{opacity:.7}
.evmore{font-size:11px;color:var(--muted);padding-left:4px}
.et-Town-hall{color:var(--magenta)}.et-Strategy-day{color:var(--purple)}.et-Offsite{color:var(--blue)}.et-Conference{color:var(--lblue)}
.et-Board-meeting{color:var(--ink)}.et-Investor-event{color:#B35C00}.et-Holiday{color:var(--teal)}.et-Other{color:var(--muted)}
.ev.et-Holiday{background:#E6F3F2}
.evlegend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px}
.evlegend span{display:inline-flex;align-items:center;gap:5px}.evlegend i{width:10px;height:10px;background:currentColor;display:inline-block}
.agenda li{grid-template-columns:120px minmax(0,1fr)}
.addev{display:grid;grid-template-columns:minmax(0,1fr) 160px 150px 150px auto;gap:6px;align-items:end}
.addev label{font-size:11px;font-weight:bold;display:flex;flex-direction:column;gap:2px}
@media (max-width:900px){.addev{grid-template-columns:1fr 1fr}.addev label:first-child{grid-column:1/-1}}
@media (max-width:700px){.calgrid{display:none}}
/* Key developments */
.devs{display:flex;flex-direction:column;gap:8px}
.dev{border-left:4px solid var(--lblue);background:var(--alt);padding:10px 14px;cursor:pointer}
.dev:hover{background:var(--tile)}
.dev .dh{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.dev .dh b{font-size:14px}
.dev p{margin:4px 0 0;white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px}
.topic{display:inline-block;font-size:10px;font-weight:bold;letter-spacing:.05em;text-transform:uppercase;color:var(--blue);border:1px solid currentColor;padding:0 5px;white-space:nowrap}
.adddev{display:grid;grid-template-columns:minmax(0,1fr) 180px auto;gap:6px;align-items:start}
.adddev textarea{grid-column:1/-1;min-height:44px}
@media (max-width:700px){.adddev{grid-template-columns:1fr}}
/* Dashboard: project table with the reminders panel beside it */
.weekgrid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:24px;align-items:start}
.weekgrid>*{min-width:0}
.reminders{position:sticky;top:12px;background:var(--alt);border-top:3px solid var(--purple);padding:12px 14px 14px}
.reminders h3{margin:0 0 2px;font-size:15px;color:var(--purple)}
.reminders .hint{font-size:12px;color:var(--muted);margin:0 0 6px}
.reminders .todo{grid-template-columns:28px minmax(0,1fr)}
.reminders .todo input[type=checkbox]{width:20px;height:20px;margin-top:1px}
.todo.leaving .tx b{text-decoration:line-through;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.todo.leaving{transition:opacity .5s ease-in;opacity:.35}}
.remdone{margin-top:8px;font-size:12px}
.remdone summary{cursor:pointer;color:var(--blue);text-decoration:underline}
.remdone .todos{margin-top:4px}
.reminders .todo .due{grid-column:2;text-align:left}
.rem .rwho{color:var(--purple)}
.mailtag{display:inline-block;font-size:11px;color:var(--purple);white-space:nowrap}
.mailtag.sent{color:var(--teal)}.mailtag.failed{color:var(--magenta);font-weight:bold}
.emailbox{background:var(--alt);border-left:4px solid var(--purple);padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.emailbox h3{margin:0;font-size:14px}
.emailbox .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.emailbox select{width:auto;min-width:200px;max-width:100%}
.invprev{background:var(--surface);border:1px solid var(--grid);padding:8px 10px;font-size:13px}
.invprev pre{margin:4px 0 0;font:inherit;white-space:pre-wrap;overflow-wrap:anywhere}
.calbtn{background:none;border:0;padding:0;margin:0;font:inherit;color:var(--blue);text-decoration:underline;cursor:pointer}
.emailbox .st{font-size:13px}
.emailbox .st.failed{color:var(--magenta)}
.addrem{display:grid;grid-template-columns:minmax(0,1fr);gap:6px;margin-top:10px}
.addrem .btn{justify-content:center}
@media (max-width:1100px){.weekgrid{grid-template-columns:1fr}.reminders{position:static}}
.rvrem{display:grid;grid-template-columns:24px minmax(0,1fr) minmax(0,1.5fr) minmax(0,1.1fr) 140px;gap:6px;align-items:start;padding:6px 0;border-bottom:1px solid var(--grid)}
.rvrem .q{grid-column:2/-1;font-size:11px;color:var(--muted);font-style:italic;margin-top:-2px}
@media (max-width:700px){.rvrem{grid-template-columns:24px 1fr 1fr}.rvrem .q{grid-column:1/-1}}
.todo{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:8px 10px;align-items:start;padding:9px 0;border-bottom:1px solid var(--grid)}
.todo input[type=checkbox]{width:18px;height:18px;margin:2px 0 0;accent-color:var(--teal);cursor:pointer}
.todo .tx{cursor:pointer;min-width:0;overflow-wrap:anywhere}
.todo .tx:hover b{color:var(--magenta)}
.todo .meta{font-size:12px;color:var(--muted)}
.todo .due{font-size:12px;font-weight:bold;white-space:nowrap;text-align:right}
.todo.done .tx b{text-decoration:line-through;color:var(--muted);font-weight:normal}
.over{color:var(--magenta);font-weight:bold}
.owner{display:inline-block;font-size:11px;font-weight:bold;background:var(--tile);padding:1px 6px;margin-right:6px;white-space:nowrap}
.carry{font-size:11px;color:var(--purple);white-space:nowrap}

/* Tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--grid)}
table{border-collapse:collapse;width:100%;font-size:13px}
th{background:var(--head);color:var(--headInk);font-weight:bold;text-align:left;padding:8px 10px;white-space:nowrap;font-size:12px}
td{padding:8px 10px;border-top:1px solid var(--grid);vertical-align:top}
tbody tr:nth-child(even) td{background:var(--alt)}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--tile)}
td .t1{font-weight:bold}
td .t2,.t2{font-size:12px;color:var(--muted)}
td.desc{min-width:200px;max-width:340px}
td.upd{min-width:240px;max-width:520px}
td.lastupd{white-space:nowrap;min-width:96px}
td.lastupd .ago{font-size:12px;color:var(--muted)}
td.lastupd .ago.late{color:var(--magenta);font-weight:bold}
.clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.prose{white-space:pre-wrap;margin:0;overflow-wrap:anywhere}
tr.cathead td{background:var(--tile)!important;border-top:2px solid var(--ink);font-weight:bold;font-size:13px;cursor:default}
.tag{display:inline-block;font-size:10px;font-weight:bold;letter-spacing:.05em;text-transform:uppercase;padding:0 5px;margin-left:6px;vertical-align:1px;white-space:nowrap}
.tag.new{background:var(--magenta);color:#fff}
.tag.upd{background:var(--tile);color:var(--blue)}
.tag.quiet{color:var(--muted);border:1px dashed var(--muted)}
.tag.chk{color:var(--purple);border:1px solid var(--purple)}

/* Pills */
.pill{display:inline-block;padding:2px 8px;font-size:11px;font-weight:bold;border:1px solid currentColor;white-space:nowrap}
.s-Active{color:var(--blue)}
.s-Pending{color:var(--purple);border-style:dashed}
.s-Completed{color:#fff;background:var(--teal);border-color:var(--teal)}
.s-Dropped{color:var(--muted);text-decoration:line-through}
.stage{display:inline-block;margin-top:4px;font-size:11px;color:var(--muted)}

/* Filters */
.fchips{display:flex;flex-wrap:wrap;gap:6px}
.fchip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border:1px solid var(--grid);background:var(--surface);color:var(--ink);cursor:pointer;font-size:12px;font-weight:bold;white-space:nowrap}
.fchip b{font-weight:normal;color:var(--muted);font-variant-numeric:tabular-nums}
.fchip:hover{border-color:var(--ink)}
.fchip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.fchip[aria-pressed="true"] b{color:#fff}
.fchip.late{color:var(--magenta);border-color:var(--magenta)}
.fchip.late[aria-pressed="true"]{background:var(--magenta);color:#fff}
.frow{display:flex;flex-direction:column;gap:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mob{display:none}
.links{display:flex;flex-wrap:wrap;gap:6px}
.deck{display:inline-flex;align-items:center;gap:6px;padding:3px 8px 3px 4px;border:1px solid var(--grid);text-decoration:none;color:var(--ink);font-size:12px;background:var(--surface);max-width:100%}
.deck:hover{border-color:var(--magenta)}
.deck .ic{font-size:9px;font-weight:bold;color:#fff;background:var(--muted);padding:2px 3px;letter-spacing:.03em}
.deck span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Controls */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.toolbar .grow{flex:1 1 220px;min-width:0}
input[type=text],input[type=search],input[type=date],input[type=url],input[type=password],select,textarea{
  width:100%;padding:7px 9px;border:1px solid var(--grid);background:var(--surface);border-radius:0}
textarea{resize:vertical;min-height:64px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border:1px solid var(--ink);background:var(--surface);color:var(--ink);cursor:pointer;font-weight:bold;font-size:13px;white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--tile)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.primary:hover{opacity:.9}
.btn.accent{background:var(--magenta);border-color:var(--magenta);color:#fff}
.btn.danger{color:var(--magenta);border-color:var(--magenta)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:4px 9px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.inline{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.addtodo{display:grid;grid-template-columns:minmax(0,1fr) 90px 150px auto;gap:6px;align-items:start}
@media (max-width:700px){.addtodo{grid-template-columns:1fr 1fr}.addtodo input:first-child{grid-column:1/-1}}

/* Drawer */
.scrim{position:fixed;inset:0;background:var(--overlay);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(640px,100%);background:var(--surface);z-index:41;display:flex;flex-direction:column;box-shadow:var(--shadow);
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.drawer.wide{width:min(980px,100%)}
.drawer.still{animation:none!important}
.drawer-h{display:flex;align-items:flex-start;gap:12px;padding:16px 20px;border-bottom:1px solid var(--grid)}
.drawer-h h2{margin:0;font-size:20px;color:var(--magenta);font-weight:normal;flex:1;min-width:0}
.drawer-b{flex:1;overflow:auto;padding:18px 20px;display:flex;flex-direction:column;gap:20px}
.drawer-f{display:flex;flex-wrap:wrap;gap:8px;padding:12px 20px;border-top:1px solid var(--grid);align-items:center}
.drawer-f .sp{flex:1}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
.fgrid .full{grid-column:1/-1}
@media (max-width:560px){.fgrid{grid-template-columns:1fr}}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:bold;min-width:0}
label.f em{font-weight:normal;font-style:normal;color:var(--muted)}
label.chk{display:flex;gap:8px;align-items:flex-start;font-size:13px}
label.chk input{margin-top:3px}
.linkrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr) auto;gap:6px;margin-bottom:6px}
@media (max-width:560px){.linkrow{grid-template-columns:1fr}}
.kv{display:grid;grid-template-columns:130px minmax(0,1fr);gap:6px 14px;font-size:13px}
.kv dt{font-weight:bold}.kv dd{margin:0}
.empty{border:1px dashed var(--grid);padding:28px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.empty p{margin:0;max-width:60ch}
.toast .undo{margin-left:12px;background:none;border:0;padding:0;color:#fff;font:inherit;font-weight:bold;text-decoration:underline;cursor:pointer}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;z-index:60;font-size:13px;max-width:calc(100% - 32px)}
.lastsaved{margin-top:4px;font-size:12px;color:var(--muted)}
#drAlert:empty{display:none}
.conflict{background:var(--tile);border-left:4px solid var(--magenta);padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.conflict h3{margin:0;font-size:15px;color:var(--magenta)}
.conflict p{margin:0}
.conflict .cf{display:flex;flex-direction:column;gap:6px;padding-top:8px;border-top:1px solid var(--grid)}
.conflict .acts{display:flex;gap:8px;flex-wrap:wrap}
.conflict .btn.on{background:var(--ink);border-color:var(--ink);color:#fff}

/* Transcript review */
.rv{border:1px solid var(--grid);border-left:4px solid var(--blue);padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.rv.off{opacity:.55;border-left-color:var(--grid)}
.rv.n{border-left-color:var(--magenta)}.rv.a{border-left-color:var(--teal)}
.rv .rh{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
.rv .rh label.chk{font-weight:bold;font-size:14px;flex:1;min-width:200px}
.rv .why{font-size:12px;color:var(--muted);font-style:italic}
.rv .old{font-size:12px;color:var(--muted);white-space:pre-wrap;border-left:2px solid var(--grid);padding-left:8px}
.rvgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.rvgrid .full{grid-column:1/-1}
@media (max-width:700px){.rvgrid{grid-template-columns:1fr}}

<body>

        <button role="menuitem" data-act="settings">Settings</button><button role="menuitem" data-act="import-wb">Import workbook (.xlsx)</button><button role="menuitem" data-act="change-pw">Change password</button><button role="menuitem" data-act="signout">Sign out</button></div>

<div id="drawerRoot"></div>
<div id="toastRoot"></div>

<script>
"use strict";
/* ---------- constants ---------- */
const CATEGORIES = ["Portfolio Growth Initiatives","Strategy Refinement / Organic Growth Initiatives","External Growth Initiatives","Quarterly Board Updates","Other Projects"];
const CAT_SHORT = {"Portfolio Growth Initiatives":"Portfolio growth","Strategy Refinement / Organic Growth Initiatives":"Strategy / organic","External Growth Initiatives":"External growth","Quarterly Board Updates":"Board updates","Other Projects":"Other"};
const NO_CAT = "Not categorised";
const STATUSES = ["Active","Pending","Completed","Dropped"];
const OPEN = ["Active","Pending"];
const STATUS_HELP = {Active:"Ongoing",Pending:"No update, or waiting on someone else",Completed:"Finished or sent out; comes off the list",Dropped:"Started but taken off the list without finishing"};
const STAGES = ["Screening","NDA signed","LOI","Diligence","Closed","On hold","Dead"];   // deal stage: External Growth projects only
const EXTERNAL = "External Growth Initiatives", BOARD = "Quarterly Board Updates";
const PROJECT_FIELDS = ["name","category","quarter","status","stage","description","stakeholders","corpDev","update","links"];
const TODO_FIELDS = ["person","text","topic","type","date","endDate","location","owner","projectId","due","done","notes"];
const FIELD_LABELS = {name:"Project",category:"Category",quarter:"Quarter",status:"Status",stage:"Deal stage",description:"Description",stakeholders:"Stakeholders",corpDev:"Corp Dev",update:"Weekly update",links:"Links",
  person:"Follow up with",text:"To-do",topic:"Topic",type:"Type",date:"Date",endDate:"End date",location:"Location",owner:"Owner",projectId:"Project",due:"Due",done:"Done",notes:"Notes",closedAt:"Closed",updateDate:"Update date"};
const LONG_FIELDS = ["description","update","notes"];
const QUIET_DAYS = 21;
const EVENT_TYPES = ["Town hall", "Strategy day", "Offsite", "Conference", "Board meeting", "Investor event", "Holiday", "Other"];
const DEV_TOPICS = ["Industry trends", "Company news", "Market and deals", "Regulation", "Ascot", "Other"];
const DAY_MS = 86400000;
const XLSX_SRC = "https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js";
const JSZIP_SRC = "https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js";

/* ---------- state ---------- */
const CFG = Object.assign({}, window.TRACKER_CONFIG || {});
if(CFG.supabaseUrl) CFG.supabaseUrl = String(CFG.supabaseUrl).trim().replace(/\/+$/,"").replace(/\/(rest|auth)\/v1$/,"");
const TABLES = ["projects","todos","meetings"];
const S = {
  view:"week", sb:null, db:null, meId:null, session:null, authChecked:false, started:false, channel:null, loginErr:"", loginBusy:false,
  projects:[], todos:[], reminders:[], developments:[], events:[], meetings:[], loaded:{projects:false,todos:false,meetings:false}, stale:false, configMissing:false,
  profiles:{}, settings:{}, hist:{}, changes:null,
  q:"", pf:"open", pcat:"all", ppl:"all", tf:"open", tpl:"all", aq:"", dq:"", dtopic:"all", calMonth:"", etype:"all", drawer:null
};

/* ---------- helpers ---------- */
function iso(d){ const z=new Date(d.getTime()-d.getTimezoneOffset()*60000); return z.toISOString().slice(0,10); }
const TODAY = () => iso(new Date());
function esc(s){ return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function fmtDate(s){ if(!s) return ""; const d=new Date(s+"T00:00:00"); if(isNaN(d)) return esc(s);
  return d.toLocaleDateString("en-GB",{day:"numeric",month:"short", ...(d.getFullYear()!==new Date().getFullYear()?{year:"numeric"}:{})}); }
function fmtWhen(ms){ if(!ms) return ""; const d=new Date(ms); return d.toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"})+" "+d.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"}); }
function fmtAgo(ms){ if(!ms) return ""; const m=Math.round((Date.now()-ms)/60000); if(m<1) return "just now"; if(m<60) return `${m} min ago`; const h=Math.round(m/60); if(h<24) return `${h} h ago`; return fmtWhen(ms); }
function daysUntil(s){ if(!s) return null; return Math.round((new Date(s+"T00:00:00") - new Date(TODAY()+"T00:00:00"))/DAY_MS); }
function addDays(s,n){ const d=new Date(s+"T00:00:00"); d.setDate(d.getDate()+n); return iso(d); }
function safeUrl(u){ try{ const x=new URL(String(u).trim()); return (x.protocol==="https:"||x.protocol==="http:") ? x.href : null; }catch{ return null; } }
function uid(){ return Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4); }
function toast(msg, undo){ const r=document.getElementById("toastRoot"); toast.undo=undo||null; r.innerHTML=`<div class="toast" role="status">${esc(msg)}${undo?`<button type="button" class="undo" data-act="toast-undo">Undo</button>`:""}</div>`; clearTimeout(toast.t); toast.t=setTimeout(()=>{ r.innerHTML=""; toast.undo=null; }, undo?7000:3600); }
function nameOf(id, stored){ if(stored) return stored; if(!id) return "Someone"; const p=S.profiles[id]; return (p && p.name) || "Teammate"; }
const val = id => (document.getElementById(id)?.value ?? "").trim();
const isOpen = p => OPEN.includes(p.status||"Active");
const catOf = p => CATEGORIES.includes(p.category) ? p.category : NO_CAT;
const projById = id => S.projects.find(p=>p.id===id);
const allTodos = () => [...S.todos, ...S.reminders];
const allRows = () => [...S.todos, ...S.reminders, ...S.developments, ...S.events];
const initialsList = s => String(s||"").toUpperCase().split(/[\/,&;]|\s+and\s+|\s+/).map(x=>x.trim()).filter(Boolean);
function myInitials(){ return ((S.session && S.session.initials) || "").toUpperCase(); }
function statusPill(st){ st=STATUSES.includes(st)?st:"Active"; return `<span class="pill s-${st}" title="${esc(STATUS_HELP[st])}">${st}</span>`; }
function loadScript(src, what){ return new Promise((res,rej)=>{ if(loadScript.done&&loadScript.done[src]) return res(); const el=document.createElement("script"); el.src=src; el.onload=()=>{ (loadScript.done=loadScript.done||{})[src]=1; res(); }; el.onerror=()=>rej(new Error(`the ${what} library didn't load. Check your connection and try again`)); document.head.appendChild(el); }); }
function links(list){ const ok=(list||[]).map(l=>({...l,u:safeUrl(l.url)})).filter(l=>l.u); if(!ok.length) return `<span class="t2">None linked</span>`;
  return `<div class="links">${ok.map(l=>`<a class="deck" href="${esc(l.u)}" target="_blank" rel="noopener noreferrer" title="${esc(l.u)}"><span class="ic">LINK</span><span>${esc(l.label||"Open file")}</span></a>`).join("")}</div>`; }
function latestMeeting(){ return [...S.meetings].sort((a,b)=>String(b.date).localeCompare(String(a.date)))[0] || null; }
function prevMeeting(){ return [...S.meetings].sort((a,b)=>String(b.date).localeCompare(String(a.date)))[1] || null; }
function teamInitials(){ const s=new Set(); Object.values(S.profiles).forEach(p=>p.initials&&s.add(p.initials.toUpperCase())); S.projects.forEach(p=>initialsList(p.corpDev).forEach(i=>/^[A-Z]{2,3}$/.test(i)&&s.add(i))); return [...s].sort(); }
function quietDays(p){ const d=p.updateDate || (p.createdAt?iso(new Date(p.createdAt)):""); if(!d) return null; return -daysUntil(d); }
function projTags(p){
  const lm=latestMeeting(); let t="";
  if(lm && p.createdInMeeting===lm.id) t+=`<span class="tag new">New</span>`;
  else if(lm && p.updateDate===lm.date) t+=`<span class="tag upd">Updated</span>`;
  const q=quietDays(p); if(isOpen(p) && q!=null && q>=QUIET_DAYS) t+=`<span class="tag quiet" title="No update since ${esc(fmtDate(p.updateDate||""))}">Quiet ${Math.floor(q/7)} wk</span>`;
  if(p.categoryCheck) t+=`<span class="tag chk" title="Claude filed this category automatically. Open the project to confirm it.">Check category</span>`;
  return t;
}
function todoOverdue(t){ const n=daysUntil(t.due); return !t.done && n!=null && n<0; }
function sortTodos(list){ return list.sort((a,b)=>(a.done-b.done) || String(a.due||"9999").localeCompare(String(b.due||"9999")) || String(a.owner||"").localeCompare(String(b.owner||"")) || (a.createdAt||0)-(b.createdAt||0)); }

/* ---------- routing ---------- */
const VIEWS = ["week","projects","todos","archive","developments","calendar","meetings"];
function parseHash(){ let h=(location.hash||"").replace(/^#/,""); try{ h=decodeURIComponent(h); }catch{} const m=h.match(/^(project|todo|meeting)\/(.+)$/); return m?{kind:m[1],id:m[2]}:{view:h}; }
function route(){
  const r=parseHash();
  if(r.kind){ if(!S.routed) S.view = r.kind==="todo"?"todos":r.kind==="meeting"?"meetings":"projects"; S.routed=true; render(); openRoute(r); return; }
  S.pushed=false;
  if(S.drawer && S.drawer.id && ["project","todo","meeting"].includes(S.drawer.kind)) S.drawer=null;
  S.view = VIEWS.includes(r.view) ? r.view : "week"; S.routed=true; render();
}
function openRoute(r){
  const tbl = r.kind+"s";
  if(!S.session || !S.loaded[tbl]){ S.pendingRoute=r; return; }
  S.pendingRoute=null;
  const dr=S.drawer; if(dr && dr.id===r.id && dr.kind===r.kind) return;
  const rec=(tbl==="todos"?allRows():S[tbl]).find(x=>x.id===r.id);
  if(!rec){ toast(`That ${r.kind==="todo"?"to-do":r.kind} isn't in the tracker. It may have been deleted.`); history.replaceState(null,"","#"+S.view); S.pushed=false; return; }
  if(r.kind==="meeting"){ S.drawer={kind:"meeting",id:r.id}; renderDrawer(); }
  else openEditor(r.kind, r.id);
}
function goRecord(kind,id){ const h="#"+kind+"/"+encodeURIComponent(id); if(location.hash===h) openRoute({kind,id}); else { S.pushed=true; location.hash=h; } }
window.addEventListener("hashchange", route);

/* ---------- render ---------- */
function render(){
  const v=document.getElementById("view");
  document.getElementById("tabs").hidden = !S.session;
  const wn=document.getElementById("whoName"); wn.textContent = S.session ? S.session.name : "";
  document.getElementById("whoMenuName").innerHTML = S.session ? `<b>${esc(S.session.name)}</b><span>${esc(S.session.username||"")}${S.session.initials?` · ${esc(S.session.initials)}`:""}</span>` : "";
  if(!S.session){ setMenu(false); const keep=[val("li_user")]; v.innerHTML=loginHTML(); const u=document.getElementById("li_user"); if(u&&keep[0]) u.value=keep[0]; renderDrawer(); return; }
  document.querySelectorAll("nav.tabs a").forEach(a => a.setAttribute("aria-current", a.dataset.view===S.view ? "page" : "false"));
  const mine=S.todos.filter(t=>!t.done && myInitials() && initialsList(t.owner).includes(myInitials())).length;
  document.getElementById("tagTodos").textContent = mine ? `${mine} yours` : "";
  const html = TABLES.some(t=>!S.loaded[t]) ? "" : S.view==="projects" ? renderProjects() : S.view==="todos" ? renderTodos() : S.view==="archive" ? renderArchive() : S.view==="developments" ? renderDevelopments() : S.view==="calendar" ? renderCalendar() : S.view==="meetings" ? renderMeetings() : renderWeek();
  const ae=document.activeElement, aid=ae&&ae.id, pos=ae&&ae.selectionStart;
  v.innerHTML = statusBanner() + html;
  if(aid){ const e=document.getElementById(aid); if(e && e!==document.activeElement && /^(q|aq|tq|dq)$/.test(aid)){ e.focus(); try{ e.setSelectionRange(pos,pos); }catch{} } }
  renderDrawer();
}
function statusBanner(){
  if(TABLES.some(t=>!S.loaded[t])) return S.stale ? `<div class="banner"><span>The shared tracker can't be reached yet. Check your connection; the page keeps trying.</span></div>` : `<div class="banner"><span>Loading the shared tracker…</span></div>`;
  return "";
}
function emptyStart(){
  return `<div class="empty"><p><b>No projects yet.</b> Import your current project workbook (.xlsx) to bring in the Current tab, Old Projects and the dated weekly tabs, or add projects one by one.</p>
    <div class="inline"><button class="btn primary" data-act="import-wb">Import workbook</button><button class="btn" data-act="new-project">New project</button></div></div>`;
}

/* This week: the dashboard */
function renderWeek(){
  const lm=latestMeeting(), open=S.projects.filter(isOpen);
  const act=open.filter(p=>p.status!=="Pending"), pend=open.filter(p=>p.status==="Pending");
  const openTodos=S.todos.filter(t=>!t.done), overdue=openTodos.filter(todoOverdue);
  const updated = lm ? open.filter(p=>p.updateDate===lm.date || p.createdInMeeting===lm.id).length : 0;
  const closedLast = lm ? S.projects.filter(p=>!isOpen(p) && p.closedAt===lm.date) : [];
  const weekEnd = addDays(TODAY(), 7);
  const due = sortTodos(openTodos.filter(t=>!t.due || t.due<=weekEnd));
  const later = openTodos.length - due.length;
  return `
  <section class="pagehead"><div><h2 class="action-title">${lm?`Week of ${esc(fmtDate(lm.date))}`:"This week"}</h2>
    <p class="sub">${lm?`From the meeting on ${esc(fmtDate(lm.date))}${lm.summary?`: ${esc(lm.summary)}`:"."}`:"Import a meeting transcript to fill in this week's updates and to-dos."}</p></div>
    <div class="headacts"><button class="btn accent" data-act="import-tr">Import transcript</button><button class="btn" data-act="export-xlsx">Export Excel</button><button class="btn" data-act="print">Print</button></div></section>
  <section class="tiles" aria-label="Headline numbers">
    <div class="tile"><b class="c-blue">${act.length}</b><span>Active projects</span><small>${open.length} on the list</small></div>
    <div class="tile"><b class="c-purple">${pend.length}</b><span>Pending</span><small>No update, or waiting on others</small></div>
    <div class="tile"><b class="c-mag">${openTodos.length}</b><span>Open to-dos</span><small>${overdue.length} overdue</small></div>
    <div class="tile"><b class="c-teal">${updated}</b><span>Updated at the last meeting</span><small>${closedLast.length?`${closedLast.length} completed or dropped`:lm?"None closed":"No meeting yet"}</small></div>
  </section>
  <section class="cols">
    <div><h3 class="sec">To-dos for the week <span class="n">${due.length}</span></h3>${todoListHTML(due, {showProject:true})}
      ${later?`<p class="t2" style="margin-top:6px"><a href="#todos">${later} more due later</a></p>`:""}</div>
    <div><h3 class="sec">Coming up <span class="n">next 30 days</span></h3>${comingUpHTML()}<h3 class="sec" style="margin-top:18px">What changed</h3>${changesHTML()}</div>
  </section>
  <div class="weekgrid"><div>${S.projects.length ? projectTableHTML(open, {grouped:true}) : emptyStart()}</div>${remindersPanelHTML()}</div>
  <p class="source">Source: Corp Dev weekly meetings${lm?`; last meeting ${esc(fmtDate(lm.date))}`:""}. Statuses: Active (ongoing), Pending (no update, or waiting on someone else).</p>`;
}

/* Calendar reminders: contacts live in the settings row "contacts" ({list:[{id,name,email}]}); only names are shown,
   except under Settings. "Remind in 24/48 hours" opens a new Outlook calendar event (Outlook on the web deep link)
   with the contact invited and the details filled in; the person clicks Send in Outlook. The reminder records
   calTo (contact id), calName and calAt (event start, ms). A downloadable .ics is offered for desktop Outlook. */
const EMAIL_RE = /^[^\s@<>()"',;:]+@[^\s@<>()"',;:]+\.[^\s@<>()"',;:]+$/;
function contacts(){ const l=(S.settings.contacts&&Array.isArray(S.settings.contacts.list))?S.settings.contacts.list:[]; return l.filter(c=>c&&c.id&&c.name&&EMAIL_RE.test(c.email||"")).sort((a,b)=>a.name.localeCompare(b.name)); }
function contactsText(){ return contacts().map(c=>`${c.name} (${c.email})`).join("\n"); }
/* One per line: "First Last (name@company.com)". Keeps each person's id when their email is unchanged. */
function parseContacts(text){
  const old=contacts(), out=[], bad=[], seen=new Set();
  for(const raw of String(text||"").split(/\r?\n/)){ const l=raw.trim(); if(!l) continue;
    const m=l.match(/^(.+?)\s*[(<\[]\s*([^()<>\[\]\s]+@[^()<>\[\]\s]+)\s*[)>\]]\s*$/);
    if(!m||!EMAIL_RE.test(m[2])){ bad.push(l); continue; }
    const email=m[2].trim(), name=m[1].replace(/[,;:]+$/,"").trim(), key=email.toLowerCase(); if(seen.has(key)) continue; seen.add(key);
    const prev=old.find(c=>c.email.toLowerCase()===key); out.push({id:prev?prev.id:"c"+uid(), name, email}); }
  return {list:out, bad};
}
function fmtSend(ms){ const d=new Date(ms); return d.toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"})+" at "+d.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"}); }
/* Start time: 24 or 48 hours from now, rounded up to the next quarter hour. */
function calStart(hours){ const d=new Date(Date.now()+hours*3600000); d.setSeconds(0,0); d.setMinutes(Math.ceil(d.getMinutes()/15)*15); return d; }
function calDetails(t){
  const p=t.projectId&&projById(t.projectId);
  const link=location.href.split("#")[0]+"#todo/"+encodeURIComponent(t.id);
  const subject = t.person ? `Reminder: follow up with ${t.person}` : `Reminder: ${t.text||"follow-up"}`;
  const task = t.person ? `Follow up with ${t.person}${t.text?`: ${t.text}`:""}` : (t.text||"Follow up");
  const lines=[`Project Name: ${p?p.name:"None"}`, `Follow-up task: ${task}`, t.due?`By: ${fmtDate(t.due)}`:"", t.notes?`Notes: ${t.notes}`:""].filter(Boolean);
  return {subject, body:`A reminder from the Corp Dev tracker.\n\n${lines.join("\n")}\n\nOnce you've followed up, tick it off in the tracker: ${link}`};
}
function outlookLink(t, c, start){
  const d=calDetails(t), end=new Date(start.getTime()+15*60000);
  const q=new URLSearchParams({path:"/calendar/action/compose", rru:"addevent", subject:d.subject, body:d.body, startdt:start.toISOString(), enddt:end.toISOString(), to:c.email});
  return "https://outlook.office.com/calendar/0/deeplink/compose?"+q.toString();
}
function icsFile(t, c, start){
  const d=calDetails(t), end=new Date(start.getTime()+15*60000);
  const st=x=>x.toISOString().replace(/[-:]/g,"").replace(/\.\d{3}/,"");
  const e=v=>String(v||"").replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\r?\n/g,"\\n");
  const fold=l=>{ const out=[]; let r=l; while(r.length>73){ out.push(r.slice(0,73)); r=" "+r.slice(73); } out.push(r); return out.join("\r\n"); };
  const L=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Ascot Group//Corp Dev tracker//EN","METHOD:PUBLISH","BEGIN:VEVENT","UID:"+t.id+"-"+start.getTime()+"@corpdev-tracker",
    "DTSTAMP:"+st(new Date()),"DTSTART:"+st(start),"DTEND:"+st(end),"SUMMARY:"+e(d.subject),"DESCRIPTION:"+e(d.body),
    "ATTENDEE;CN="+e(c.name)+";ROLE=REQ-PARTICIPANT;RSVP=FALSE:mailto:"+c.email,"BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:"+e(d.subject),"TRIGGER:-PT15M","END:VALARM","END:VEVENT","END:VCALENDAR"];
  return L.map(fold).join("\r\n")+"\r\n";
}
function calTag(t){ return t.calName&&t.calAt ? `<span class="mailtag" title="Calendar reminder">&#128197; ${esc(t.calName)} &middot; ${esc(fmtSend(t.calAt))}</span>` : ""; }

async function openCalendar(id, hours, how){
  const t=allRows().find(x=>x.id===id), c=contacts().find(x=>x.id===val("cal_to")); if(!t) return; if(!c){ toast("Choose who to remind."); return; }

const tcls = t => "et-"+String(EVENT_TYPES.includes(t)?t:"Other").replace(/\s+/g,"-");
const evEnd = e => e.endDate && e.endDate>e.date ? e.endDate : e.date;
const evOn = (e,d) => e.date<=d && d<=evEnd(e);
function evWhen(e){ return fmtDate(e.date)+(e.endDate&&e.endDate>e.date?` to ${fmtDate(e.endDate)}`:""); }
function comingUpHTML(){

function monthStr(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"); }
function renderCalendar(){
  const ym=S.calMonth||monthStr(new Date()), [y,m]=ym.split("-").map(Number);
  const first=new Date(y,m-1,1), daysIn=new Date(y,m,0).getDate(), lead=(first.getDay()+6)%7, weeks=Math.ceil((lead+daysIn)/7);
  const today=TODAY(), monthStart=`${ym}-01`, monthEnd=`${ym}-${String(daysIn).padStart(2,"0")}`;
  const evs=S.events.filter(e=>S.etype==="all"||(e.type||"Other")===S.etype).sort((a,b)=>a.date.localeCompare(b.date)||String(a.text).localeCompare(String(b.text)));
  let cells="";
  for(let i=0;i<weeks*7;i++){ const d=new Date(y,m-1,1-lead+i), ds=iso(d), out=d.getMonth()!==m-1, wk=d.getDay()===0||d.getDay()===6;
    const on=evs.filter(e=>evOn(e,ds));
    cells+=`<div class="day${out?" out":""}${wk&&!out?" wkend":""}${ds===today?" today":""}" aria-label="${esc(d.toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long"}))}"><span class="dn">${d.getDate()}</span>
      ${on.slice(0,3).map(e=>`<button type="button" class="ev ${tcls(e.type)}${e.date<ds?" cont":""}" data-act="open-todo" data-id="${esc(e.id)}" title="${esc(e.text)} (${esc(e.type||"Other")}, ${esc(evWhen(e))})">${e.date<ds&&i%7!==0?"&hellip; ":""}${esc(e.text)}</button>`).join("")}
      ${on.length>3?`<span class="evmore">+${on.length-3} more</span>`:""}</div>`; }

async function addEvent({text, type, date, endDate, location, notes, quote, meetingId, meetingDate}, {quiet}={}){
  text=String(text||"").trim(); if(!text){ toast("Give the event a name."); return false; }
  if(!/^\d{4}-\d{2}-\d{2}$/.test(String(date||""))){ toast("Choose the event's date."); return false; }
  const body={kind:"event", text, type:EVENT_TYPES.includes(type)?type:"Other", date, endDate:endDate&&endDate>date?endDate:"", location:location||"", notes:notes||"", quote:quote||"", done:false,
    meetingId:meetingId||"", meetingDate:meetingDate||"", createdAt:Date.now(), createdBy:S.meId||"", ...meta()};
  if(quiet){ await S.db.collection("todos").doc("e"+uid()).set(body,{quiet:true}); return true; }
  const ok=await guard(()=>S.db.collection("todos").doc("e"+uid()).set(body), "Event added");
  if(ok){ S.calMonth=date.slice(0,7); render(); }
  return ok;
}
function eventIcs(e){
  const d=x=>x.replace(/-/g,""), end=addDays(evEnd(e),1);
  const esc2=v=>String(v||"").replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\r?\n/g,"\\n");
  const L=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Ascot Group//Corp Dev tracker//EN","METHOD:PUBLISH","BEGIN:VEVENT","UID:"+e.id+"@corpdev-tracker",
    "DTSTAMP:"+new Date().toISOString().replace(/[-:]/g,"").replace(/\.\d{3}/,""),"DTSTART;VALUE=DATE:"+d(e.date),"DTEND;VALUE=DATE:"+d(end),"TRANSP:TRANSPARENT",
    "SUMMARY:"+esc2(e.text),...(e.location?["LOCATION:"+esc2(e.location)]:[]),"DESCRIPTION:"+esc2([e.type, e.notes].filter(Boolean).join(". ")),"END:VEVENT","END:VCALENDAR"];
  const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([L.join("\r\n")+"\r\n"],{type:"text/calendar;charset=utf-8"}));
  a.download=String(e.text).replace(/[^\w.-]+/g,"-").slice(0,60)+".ics"; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },1000);
  toast("Calendar file downloaded. Open it to add the event to Outlook.");
}

/* What changed: change history for the last 7 days */
async function loadChanges(){
  S.changes={loading:true};
  const since=new Date(Date.now()-7*DAY_MS).toISOString();
  try{ const {data,error}=await S.sb.from("history").select("tbl,record_id,op,changes,changed_at,changed_by").eq("tbl","projects").gte("changed_at",since).order("changed_at",{ascending:false}).limit(300);
    S.changes = error ? {err:error.message} : {rows:data||[]}; }catch(e){ S.changes={err:String(e&&e.message||e)}; }
  if(S.view==="week") render();
}
function changesHTML(){
  if(!S.changes){ loadChanges(); return `<p class="t2">Loading…</p>`; }
  if(S.changes.loading) return `<p class="t2">Loading…</p>`;
  if(S.changes.err) return `<p class="t2">Couldn't load the change log: ${esc(S.changes.err)}</p>`;
  const items=[]; const B=t=>`<b>${esc(t)}</b>`;
  for(const r of S.changes.rows){ const p=projById(r.record_id); const ch=r.changes||{}; const n=(p&&p.name)||(ch.doc&&ch.doc.name)||(ch.name&&(ch.name.to||ch.name.from))||"A deleted project";
    const at=Date.parse(r.changed_at), id=p?p.id:null;
    if(r.op==="insert") items.push({html:`New project: ${B(n)}`,at,id,by:r.changed_by});
    else if(r.op==="delete") items.push({html:`${B(n)} deleted`,at,id:null,by:r.changed_by});
    else { if(ch.status&&ch.status.from!==ch.status.to) items.push({html:`${B(n)}: ${esc(ch.status.from||"Active")} → ${esc(ch.status.to||"Active")}`,at,id,by:r.changed_by});
      else if(ch.update) items.push({html:`${B(n)} update`,at,id,by:r.changed_by});
      if(ch.category) items.push({html:`${B(n)} moved to ${esc(CAT_SHORT[ch.category.to]||ch.category.to||NO_CAT)}`,at,id,by:r.changed_by}); } }
  // a bulk add (the workbook import) reads as one line, not one per project
  const adds=items.filter(i=>i.html.startsWith("New project:"));
  if(adds.length>5){ const keep=items.filter(i=>!adds.includes(i)); keep.push({html:`${adds.length} projects added`, at:adds[0].at, id:null, by:adds[0].by}); items.length=0; items.push(...keep.sort((a,b)=>b.at-a.at)); }
  // one line per project and kind of change
  const seen=new Set(); const list=items.filter(i=>{ const k=i.html; if(seen.has(k)) return false; seen.add(k); return true; }).slice(0,12);
  if(!list.length) return `<p class="t2">Nothing changed in the last 7 days.</p>`;
  return `<ul class="mlist">${list.map(i=>`<li${i.id?` class="click" data-act="open-project" data-id="${esc(i.id)}" tabindex="0"`:""}><span class="d">${esc(new Date(i.at).toLocaleDateString("en-GB",{day:"numeric",month:"short"}))}</span><div><p>${i.html}</p><p class="meta">${esc(nameOf(i.by))}</p></div></li>`).join("")}</ul>`;
}

function renderDrawer(){
  const root=document.getElementById("drawerRoot"); const dr=S.drawer;
  if(!dr){ if(root.innerHTML) root.innerHTML=""; return; }
  if(dr.rendered){ if(dr.kind==="meeting"||(dr.kind==="transcript"&&dr.live)) { /* fall through to refresh */ } else return; }
  dr.rendered=true;
  const body = dr.kind==="project" ? projectFormHTML(dr) : dr.kind==="todo" ? todoFormHTML(dr) : dr.kind==="meeting" ? meetingHTML(dr) :
    dr.kind==="transcript" ? transcriptHTML(dr) : dr.kind==="workbook" ? workbookHTML(dr) : dr.kind==="settings" ? settingsHTML() : dr.kind==="snapshot" ? snapshotHTML() : passwordFormHTML();
  const key=dr.kind+":"+(dr.id||""), same=root.dataset.key===key && !!root.querySelector(".drawer");
  const top=same?root.querySelector(".drawer-b")?.scrollTop||0:0;
  root.innerHTML=`<div class="scrim" data-act="close"></div><aside class="drawer${["transcript","workbook","meeting"].includes(dr.kind)?" wide":""}${same?" still":""}" role="dialog" aria-modal="true" aria-labelledby="drTitle">${body}</aside>`;
  root.dataset.key=key;
  if(same){ const b=root.querySelector(".drawer-b"); if(b) b.scrollTop=top; }
  if(dr.kind==="project"||dr.kind==="todo"){ renderDrAlert(); renderHistory(); loadHistory(dr); }
  const f=root.querySelector("input:not([type=checkbox]):not([type=file]),textarea,select"); if(f && !same && dr.kind!=="meeting") f.focus();
}
function rerenderDrawer(){ if(S.drawer){ captureForm(); S.drawer.rendered=false; renderDrawer(); restoreForm(); } }
function captureForm(){ const dr=S.drawer; if(!dr) return; dr.vals={}; document.querySelectorAll("#drawerRoot [id^=f_]:not([type=file])").forEach(e=>dr.vals[e.id]=e.type==="checkbox"?e.checked:e.value); readLinks(); }
function restoreForm(){ const dr=S.drawer; if(!dr||!dr.vals) return; for(const [k,v] of Object.entries(dr.vals)){ const e=document.getElementById(k); if(e){ if(e.type==="checkbox") e.checked=v; else e.value=v; } } }
function closeDrawer(){
  const dr=S.drawer; if(dr&&dr.ctrl) dr.ctrl.abort();
  const rec = dr && dr.id && ["project","todo","meeting"].includes(dr.kind);
  S.drawer=null; renderDrawer();

}

/* ---------- writes ---------- */
async function guard(fn, okMsg){
  try{ await fn(); if(okMsg) toast(okMsg); return true; }
  catch(e){
    const c=e&&e.code;
    if(c==="42501"||c==="denied") toast("Your login can't change the tracker. Ask the tracker owner to check it's set up.");
    else if(c==="not_found") toast("That record was deleted by someone else. The list has been refreshed.");
    else toast((e&&e.message) ? "Couldn't save: "+e.message : "Couldn't save. Check your connection and try again.");
    return false;
  }
}
const meta = () => ({updatedAt:Date.now(), updatedBy:S.meId||"", updatedByName:S.session?.name||""});
const META_KEYS=["id","_v","_by"];
function stripMeta(o){ const r={...(o||{})}; META_KEYS.forEach(k=>delete r[k]); return r; }
const normV = v => v==null ? "" : v;
function same(a,b){ a=normV(a); b=normV(b); return (typeof a==="object"||typeof b==="object") ? JSON.stringify(a)===JSON.stringify(b) : String(a)===String(b); }

/* Compare-and-set on updated_at, so two people saving at once never overwrite each other silently.
   build(row) returns {doc} to write, or {stop:true,...} to write nothing. One retry if someone saves in between. */
async function latestRow(table,id){ const {data,error}=await S.sb.from(table).select("id,doc,updated_at,updated_by").eq("id",id).maybeSingle(); if(error) throw error; return data||null; }
async function casWrite(table,id,build,{quiet}={}){
  let last=null;
  for(let i=0;i<2;i++){
    const row=await latestRow(table,id); if(!row){ await refetch(table); throw {code:"not_found"}; }
    const r=build(row); if(!r||r.stop) return r||{stop:true};
    const {data,error}=await S.sb.from(table).update({doc:stripMeta(r.doc)}).eq("id",id).eq("updated_at",row.updated_at).select("id");
    if(error) throw error;
    if(data&&data.length){ if(!quiet) await refetch(table); return {ok:true}; }
    last=row;
  }
  const now=await latestRow(table,id);
  if(now && last && now.updated_at===last.updated_at) throw {code:"denied"};
  throw {message:"someone else keeps saving this record. Wait a moment and try again"};
}
function makeDb(sb){
  return { collection(table){ return { doc(id){ return {
    async set(body,{quiet}={}){ const {error}=await sb.from(table).upsert({id, doc:body}); if(error) throw error; if(!quiet) await refetch(table); },
    async update(patch,{quiet}={}){ await casWrite(table, id, row=>({doc:{...(row.doc||{}), ...patch}}), {quiet}); },
    async delete(){ const {data, error}=await sb.from(table).delete().eq("id", id).select("id"); if(error) throw error; if(!data||!data.length) throw {code:"denied"}; await refetch(table); }
  }; } }; } };
}

function openEditor(kind,id){
  const rec=(kind==="project"?S.projects:allRows()).find(x=>x.id===id); if(!rec) return;
  S.drawer={kind, id, orig:JSON.parse(JSON.stringify(rec))}; renderDrawer();
  S.drawer.base = kind==="project" ? projectFormValues() : todoFormValues();
}
function whoChanged(row){ const d=row.doc||{}; return nameOf(row.updated_by, d.updatedByName); }
function showVal(k,v){
  if(k==="links"){ const a=Array.isArray(v)?v:[]; return a.map(l=>l.label||l.url).join(", ")||"none"; }
  if(k==="projectId") return (projById(v)||{}).name||"none";
  if(k==="done") return v?"done":"not done";
  v=normV(v); if(v==="") return "blank";
  if(k==="due"||/Date$|At$/.test(k)) return fmtDate(v);
  v=String(v); return v.length>140 ? v.slice(0,140)+"…" : v;
}
function setFormField(k,v){
  const dr=S.drawer;
  if(k==="links"){ dr.links=(Array.isArray(v)?v:[]).map(l=>({...l})); const el=document.getElementById("linkRows"); if(el) el.innerHTML=linkRowsHTML(dr.links); return; }
  const e=document.getElementById("f_"+k); if(!e) return; if(e.type==="checkbox") e.checked=!!v; else e.value=normV(v);
}
function renderDrAlert(){
  const el=document.getElementById("drAlert"); const dr=S.drawer; if(!el||!dr) return;
  const noun=dr.kind==="todo"?"to-do":"project";
  if(dr.gone){ el.innerHTML=`<div class="conflict"><h3>This ${noun} was deleted by someone else</h3><p>Your changes are still in the form. Recreate it with them, or discard them.</p>
    <div class="acts"><button type="button" class="btn sm primary" data-act="gone-recreate">Recreate it</button><button type="button" class="btn sm" data-act="close">Discard my changes</button></div></div>`; return; }
  if(dr.conflicts && dr.conflicts.length){
    el.innerHTML=`<div class="conflict"><h3>Someone else saved this ${noun} while you were editing</h3><p>Choose which value to keep for each field, then save. Their other changes are kept.</p>
    ${dr.conflicts.map((c,i)=>`<div class="cf"><div>${esc(c.who)} changed <b>${esc(FIELD_LABELS[c.k]||c.k)}</b> to <b>${esc(showVal(c.k,c.theirs))}</b>; you have <b>${esc(showVal(c.k,c.mine))}</b>.</div>
      <div class="acts"><button type="button" class="btn sm${c.choice==="theirs"?" on":""}" data-act="cf-pick" data-i="${i}" data-c="theirs" aria-pressed="${c.choice==="theirs"}">Keep theirs</button><button type="button" class="btn sm${c.choice==="mine"?" on":""}" data-act="cf-pick" data-i="${i}" data-c="mine" aria-pressed="${c.choice==="mine"}">Use mine</button></div></div>`).join("")}
    <div><button type="button" class="btn sm primary" data-act="save-${dr.kind}">Save</button></div></div>`; return; }
  el.innerHTML="";
}
async function saveRecord(kind){
  const dr=S.drawer; if(!dr) return; const table=kind+"s";
  const read=()=>kind==="project"?projectFormValues():todoFormValues();
  const v=read();
  if(kind==="project"){ if(!v.name){ toast("Give the project a name."); return; } const bad=v.links.find(l=>!safeUrl(l.url)); if(bad){ toast(`"${bad.url}" is not a web address. Paste the full https:// link.`); return; } }
  else if(!v.text && !v.person){ toast("Write the to-do first."); return; }
  const m=meta();
  if(!dr.id){
    const id=(kind==="project"?"p":"t")+uid();
    const body={...v, createdAt:Date.now(), createdBy:S.meId||"", ...m};
    if(kind==="project"){ body.updateDate=v.update?TODAY():""; body.categorySource=v.category?"person":""; if(!OPEN.includes(v.status)) body.closedAt=TODAY(); }
    if(kind==="todo"&&v.done) body.doneAt=TODAY();
    if(await guard(()=>S.db.collection(table).doc(id).set(body), kind==="project"?"Project created":"To-do added")) closeDrawer();
    return;
  }
  if(dr.gone){ toast("Choose Recreate it or Discard my changes."); return; }
  if(dr.conflicts){
    if(dr.conflicts.some(c=>!c.choice)){ toast("Choose Keep theirs or Use mine for each field."); return; }
    for(const c of dr.conflicts){ dr.orig[c.k]=c.theirs; if(c.choice==="theirs") setFormField(c.k,c.theirs); }
    const now=read(); for(const c of dr.conflicts) if(c.choice==="theirs") dr.base[c.k]=now[c.k];
    dr.conflicts=null; renderDrAlert();
  }
  const mine=read();
  const changed=Object.keys(mine).filter(k=>!same(mine[k],dr.base[k]));
  if(!changed.length){ toast("No changes to save"); closeDrawer(); return; }
  try{
    const r=await casWrite(table, dr.id, row=>{
      const latest=row.doc||{};
      const cs=changed.filter(k=>!same(latest[k],dr.orig[k]) && !same(mine[k],latest[k])).map(k=>({k, theirs:latest[k], mine:mine[k], who:whoChanged(row)}));
      if(cs.length) return {stop:true, conflicts:cs};
      const doc={...stripMeta(latest), ...Object.fromEntries(changed.map(k=>[k,mine[k]])), ...m};
      if(kind==="project"){
        if(changed.includes("update")) doc.updateDate=TODAY();
        if(changed.includes("status")){ if(OPEN.includes(mine.status)) doc.closedAt=""; else if(OPEN.includes(latest.status||"Active")) doc.closedAt=TODAY(); }
        if(changed.includes("category")){ doc.categoryCheck=false; if(latest.categorySource==="claude"){ doc.categoryCorrected=true; doc.categorySuggested=latest.category; } doc.categorySource="person"; }
      } else if(changed.includes("done")) doc.doneAt = mine.done ? TODAY() : "";
      return {doc};
    });
    if(r.conflicts){ if(S.drawer===dr){ dr.conflicts=r.conflicts; renderDrAlert(); document.getElementById("drAlert")?.scrollIntoView({block:"nearest"}); } return; }
    toast("Saved"); if(S.drawer===dr) closeDrawer();
  }catch(e){
    if(e&&e.code==="not_found"){ if(S.drawer===dr){ dr.gone=true; renderDrAlert(); } return; }
    await guard(()=>{ throw e; });
  }
}
async function recreateRecord(){
  const dr=S.drawer; if(!dr||!dr.gone) return; const kind=dr.kind;
  const body={...stripMeta(dr.orig), ...(kind==="project"?projectFormValues():todoFormValues()), ...meta()};
  if(await guard(()=>S.db.collection(kind+"s").doc(dr.id).set(body), "Recreated")) closeDrawer();
}
async function deleteRecord(){
  const dr=S.drawer; if(!dr||!dr.id) return;
  if(dr.kind==="project"){ const ts=allTodos().filter(t=>t.projectId===dr.id);
    if(await guard(async()=>{ await S.db.collection("projects").doc(dr.id).delete(); for(const t of ts) await S.db.collection("todos").doc(t.id).delete(); }, "Project deleted")) closeDrawer(); }
  else if(dr.kind==="todo"){ if(await guard(()=>S.db.collection("todos").doc(dr.id).delete(), "To-do deleted")) closeDrawer(); }
  else if(dr.kind==="meeting"){ if(await guard(()=>S.db.collection("meetings").doc(dr.id).delete(), "Snapshot deleted")) closeDrawer(); }
}
async function toggleTodo(id, done){
  const row=allRows().find(x=>x.id===id), rem=row&&row.kind==="reminder";
  if(done){ document.querySelectorAll(`.todo[data-id="${CSS.escape(id)}"]`).forEach(li=>li.classList.add("leaving")); await new Promise(r=>setTimeout(r,500)); }
  const ok=await guard(()=>S.db.collection("todos").doc(id).update({done, doneAt:done?TODAY():"", ...meta()}));
  if(ok){ if(done) toast(rem?`Followed up with ${row.person||"them"}`:"Done", ()=>toggleTodo(id,false)); else toast(rem?"Back on the reminders list":"Reopened"); }
  if(S.drawer && S.drawer.kind==="project"){ S.drawer.rendered=false; captureForm(); renderDrawer(); restoreForm(); }
}

    meetingId:"", meetingDate:lm&&lm.date>=addDays(TODAY(),-7)?lm.date:"", createdAt:Date.now(), createdBy:S.meId||"", ...meta()}), "To-do added");

async function addReminder({person, text, owner, projectId}){
  person=String(person||"").trim(); text=String(text||"").trim(); if(!person && !text){ toast("Write who to follow up with first."); return false; }
  const lm=latestMeeting();
  return guard(()=>S.db.collection("todos").doc("r"+uid()).set({kind:"reminder", person, text, owner:String(owner||"").trim().toUpperCase(), due:"", projectId:projectId||"", done:false, notes:"",
    meetingId:"", meetingDate:lm&&lm.date>=addDays(TODAY(),-7)?lm.date:"", createdAt:Date.now(), createdBy:S.meId||"", ...meta()}), "Reminder added");

function snapshotRows(date){
  return S.projects.filter(p=>isOpen(p) || p.closedAt===date).map(p=>({id:p.id, name:p.name, category:p.category||"", quarter:p.quarter||"", status:p.status||"Active", stage:p.stage||"",
    description:p.description||"", stakeholders:p.stakeholders||"", corpDev:p.corpDev||"", update:p.update||""}));
}
async function saveMeeting(date, {summary, source, title}){
  const id="m"+date; const ex=S.meetings.find(m=>m.id===id);
  const doc={...(ex?stripMeta(ex):{createdAt:Date.now(), createdBy:S.meId||""}), date, title:title||(ex&&ex.title)||"Weekly meeting", source:(ex&&ex.source)||source,
    summary:[ex&&ex.summary, summary].filter(Boolean).join(" ").trim(), snapshot:snapshotRows(date), ...meta()};
  await S.db.collection("meetings").doc(id).set(doc);
  return id;
}

/* ---------- history ---------- */
async function loadHistory(dr){
  if(!dr||!dr.id||!S.sb) return; const key=dr.kind+":"+dr.id; if(S.hist[key]&&S.hist[key].at>Date.now()-2000) return;
  try{ const {data,error}=await S.sb.from("history").select("op,changes,changed_at,changed_by").eq("tbl",dr.kind+"s").eq("record_id",dr.id).order("changed_at",{ascending:false}).limit(40);
    S.hist[key] = error ? {err:error.message, at:Date.now()} : {rows:data||[], at:Date.now()}; }catch(e){ S.hist[key]={err:String(e&&e.message||e), at:Date.now()}; }
  renderHistory();
}
function changeLines(row){
  if(row.op==="insert") return ["Created"]; if(row.op==="delete") return ["Deleted"];
  return Object.entries(row.changes||{}).filter(([k])=>!["updateDate","doneAt","closedAt","categorySource","categoryCheck","categoryCorrected","categorySuggested","categoryReason","createdInMeeting"].includes(k)).map(([k,c])=>{ const L=FIELD_LABELS[k]||k;
    if(LONG_FIELDS.includes(k)) return `${L} edited`; return `${L}: ${showVal(k,c&&c.from)} → ${showVal(k,c&&c.to)}`; });
}
function renderHistory(){
  const el=document.getElementById("histList"); const dr=S.drawer; if(!el||!dr||!dr.id) return;
  const h=S.hist[dr.kind+":"+dr.id];
  if(!h){ el.innerHTML=`<li><span class="d"></span><p class="t2">Loading history…</p></li>`; return; }
  if(h.err){ el.innerHTML=`<li><span class="d"></span><p class="t2">Couldn't load the history: ${esc(h.err)}</p></li>`; return; }
  const rows=h.rows.map(r=>({r, lines:changeLines(r)})).filter(x=>x.lines.length);
  el.innerHTML = rows.length ? rows.map(({r,lines})=>`<li><span class="d">${esc(fmtWhen(Date.parse(r.changed_at)))}</span><div>${lines.map(l=>`<p>${esc(l)}</p>`).join("")}<p class="meta">${esc(nameOf(r.changed_by))}</p></div></li>`).join("") : `<li><span class="d"></span><p class="t2">No changes recorded yet.</p></li>`;
}

/* ---------- transcript: read with Claude, review, save ---------- */
function transcriptHTML(dr){
  const head=drHead("Weekly meeting","Import transcript");
  if(dr.step==="busy") return `${head}<div class="drawer-b"><div class="busy" role="status"><span class="spin" aria-hidden="true"></span><div><b>Claude is reading the transcript.</b><div class="t2">This usually takes one to three minutes. Keep this panel open.</div></div></div></div>
    <div class="drawer-f"><span class="sp"></span><button class="btn" data-act="tr-cancel">Cancel</button></div>`;
  if(dr.step==="review") return head+reviewHTML(dr);

async function readTranscriptFile(file){
  const name=(file.name||"").toLowerCase();
  if(name.endsWith(".docx")){
    await loadScript(JSZIP_SRC,"Word file");
    const zip=await window.JSZip.loadAsync(await file.arrayBuffer()); const xml=await zip.file("word/document.xml")?.async("string");
    if(!xml) throw new Error("that Word file has no text");
    const doc=new DOMParser().parseFromString(xml,"application/xml");
    return [...doc.getElementsByTagName("w:p")].map(p=>[...p.getElementsByTagName("w:t")].map(t=>t.textContent).join("")).join("\n").replace(/\n{3,}/g,"\n\n").trim();
  }
  const raw=await file.text();
  if(name.endsWith(".vtt")||/^WEBVTT/.test(raw)) return vttToText(raw);
  return raw.trim();
}
function vttToText(raw){
  const out=[]; let last="";
  for(const line of raw.split(/\r?\n/)){ const l=line.trim(); if(!l||l==="WEBVTT"||/-->/.test(l)||/^\d+$/.test(l)||/^NOTE\b/.test(l)||/^[0-9a-f-]{20,}(\/\d+-\d+)?$/i.test(l)) continue;
    const m=l.match(/^<v ([^>]+)>(.*?)(<\/v>)?$/); const who=m?m[1].trim():"", txt=(m?m[2]:l).replace(/<[^>]+>/g,"").trim(); if(!txt) continue;
    if(who && who===last) out[out.length-1]+=" "+txt; else { out.push(who?`${who}: ${txt}`:txt); last=who; } }
  return out.join("\n");
}
function claudeInput(date, transcript){
  const team=Object.values(S.profiles).map(p=>({name:p.name, initials:p.initials||""}));
  teamInitials().forEach(i=>{ if(!team.some(t=>String(t.initials).toUpperCase()===i)) team.push({name:"", initials:i}); });
  const examples=S.projects.filter(p=>CATEGORIES.includes(p.category)).sort((a,b)=>(!!b.categoryCorrected-!!a.categoryCorrected)||(b.updatedAt||0)-(a.updatedAt||0)).slice(0,300)
    .map(p=>({name:p.name, category:p.category, description:String(p.description||"").slice(0,300), corrected:!!p.categoryCorrected}));
  return {meetingDate:date, transcript,
    projects:S.projects.filter(isOpen).map(p=>({id:p.id, name:p.name, category:p.category||"", quarter:p.quarter||"", description:p.description||"", stakeholders:p.stakeholders||"", corpDev:p.corpDev||"", status:p.status||"Active", update:p.update||"", stage:p.stage||""})),

}

async function applyReview(){
  const dr=S.drawer, rv=dr.rv, date=dr.date, auto=!!(S.settings.claude&&S.settings.claude.autoCategory);
  const N=rv.n.filter(n=>n.take&&String(n.name).trim());
  if(!auto && N.some(n=>!n.catOk)){ toast("Tick \"The category is right\" for each new project, or change its category first."); return; }
  const mid="m"+date; const m=meta(); let made=0;
  const ok=await guard(async()=>{
    const nameToId={};
    for(const n of N){ const id="p"+uid(); nameToId[n.name]=id; const changed=n.category!==n.suggested;
      await S.db.collection("projects").doc(id).set({name:n.name.trim(), category:n.category, quarter:n.category===BOARD?n.quarter:"", status:OPEN.includes(n.status)?n.status:"Active", stage:n.category===EXTERNAL?n.stage:"",
        description:n.description, stakeholders:n.stakeholders, corpDev:n.corp_dev, update:n.update, updateDate:date, links:[],
        categorySource:changed?"person":"claude", categoryCorrected:changed, categorySuggested:n.suggested, categoryReason:n.category_reason, categoryCheck:!changed&&auto,
        createdInMeeting:mid, createdAt:Date.now(), createdBy:S.meId||"", ...m},{quiet:true}); made++; }
    for(const u of rv.u.filter(x=>x.take)){ const patch={update:u.update, updateDate:date, ...m};
      if(OPEN.includes(u.status)) patch.status=u.status; if(u.stage) patch.stage=u.stage;
      if(u.description) patch.description=u.description; if(u.corp_dev) patch.corpDev=u.corp_dev; if(u.stakeholders) patch.stakeholders=u.stakeholders;
      try{ await S.db.collection("projects").doc(u.project_id).update(patch,{quiet:true}); made++; }catch(e){ if(!(e&&e.code==="not_found")) throw e; } }
    for(const a of rv.a.filter(x=>x.take)){
      try{ await S.db.collection("projects").doc(a.project_id).update({status:a.status==="Completed"?"Completed":"Dropped", closedAt:date, closedNote:a.reason||"", ...m},{quiet:true}); made++; }catch(e){ if(!(e&&e.code==="not_found")) throw e; } }

      await S.db.collection("todos").doc("t"+uid()).set({text:t.text.trim(), owner:String(t.owner||"").trim().toUpperCase(), due:t.due||"", projectId:pid, done:false, notes:"", quote:t.quote||"",
        meetingId:mid, meetingDate:date, createdAt:Date.now(), createdBy:S.meId||"", ...m},{quiet:true}); made++; }
    for(const t of rv.r.filter(x=>x.take&&(String(x.person).trim()||String(x.about).trim()))){
      const pid=projById(t.project_ref)?t.project_ref:(nameToId[t.project_ref]||"");
      await S.db.collection("todos").doc("r"+uid()).set({kind:"reminder", person:String(t.person||"").trim(), text:String(t.about||"").trim(), owner:String(t.owner||"").trim().toUpperCase(), due:t.due||"", projectId:pid, done:false, notes:"", quote:t.quote||"",
        meetingId:mid, meetingDate:date, createdAt:Date.now(), createdBy:S.meId||"", ...m},{quiet:true}); made++; }
    for(const k of rv.k.filter(x=>x.take&&String(x.title||x.detail).trim())){
      await S.db.collection("todos").doc("k"+uid()).set({kind:"development", text:String(k.title||"").trim()||String(k.detail).trim().slice(0,120), notes:String(k.detail||"").trim(), topic:DEV_TOPICS.includes(k.topic)?k.topic:"Other", quote:k.quote||"", done:false,
        meetingId:mid, meetingDate:date, createdAt:Date.now(), createdBy:S.meId||"", ...m},{quiet:true}); made++; }
    for(const ev of rv.e.filter(x=>x.take&&String(x.title).trim()&&/^\d{4}-\d{2}-\d{2}$/.test(x.date))){
      await addEvent({text:ev.title, type:ev.type, date:ev.date, endDate:ev.end_date, notes:ev.notes, quote:ev.quote, meetingId:mid, meetingDate:date},{quiet:true}); made++; }
    for(const d of rv.d.filter(x=>x.take)){ try{ await S.db.collection("todos").doc(d.todo_id).update({done:true, doneAt:date, ...m},{quiet:true}); made++; }catch(e){ if(!(e&&e.code==="not_found")) throw e; } }
    await refetch("projects"); await refetch("todos");
    await saveMeeting(date,{summary:rv.summary, source:"transcript"});
  });
  if(ok){ toast(`Saved ${made} change${made===1?"":"s"} and recorded the meeting`); S.changes=null; closeDrawer(); location.hash="#week"; }

function normCategory(s){ s=String(s||"").toLowerCase(); if(!s.trim()) return "";
  if(/portfolio/.test(s)) return CATEGORIES[0]; if(/strategy refinement|organic/.test(s)) return CATEGORIES[1]; if(/external|m&a/.test(s)) return CATEGORIES[2];
  if(/board/.test(s)) return CATEGORIES[3]; if(/other/.test(s)) return CATEGORIES[4]; return ""; }
const cleanCell = v => String(v??"").replace(/\r/g,"").split("\n").map(l=>l.trimEnd()).join("\n").trim().replace(/^-\s*$/,"");
function dateFrom(s){ s=String(s||""); let m=s.match(/(\d{1,2})[\/.](\d{1,2})[\/.](\d{2,4})/); if(!m) return "";
  let y=+m[3]; if(y<100) y+=2000; const mo=+m[1], d=+m[2]; if(mo<1||mo>12||d<1||d>31) return ""; return `${y}-${String(mo).padStart(2,"0")}-${String(d).padStart(2,"0")}`; }
function openStatusFrom(update){ const u=update.toLowerCase().replace(/[-\s]+/g," ").trim(); return (!u || /^(tbu|tbd|to be discussed)\b/.test(u) || /\bawaiting\b|\bwaiting (on|for)\b/.test(u)) ? "Pending" : "Active"; }
function closedStatusFrom(update){ const u=update.toLowerCase(); return /kill|to be (removed|killed)|\bremoved?\b|\bdoa\b|\bpass\b|not selling|dropped/.test(u) ? "Dropped" : "Completed"; }
function parseSheet(rows){
  const hi=rows.findIndex(r=>r.some(c=>String(c).trim().toLowerCase()==="project")); if(hi<0) return null;
  const H=rows[hi].map(c=>String(c).trim().toLowerCase());
  const col=n=>H.findIndex(c=>c===n), pc=col("project"), dc=col("description"), sc=col("stakeholders"), cc=H.findIndex(c=>c.replace(/\s/g,"")==="corpdev");
  let uc=H.findIndex(c=>/status/.test(c)); if(uc<0) uc=Math.max(pc,dc,sc,cc)+1;
  const headDate=uc>=0?dateFrom(rows[hi][uc]):"";
  const catCol=pc>0 && rows.slice(hi+1).some(r=>normCategory(r[pc-1])) ? pc-1 : -1;
  let cat=""; const out=[];
  rows.slice(hi+1).forEach((r,i)=>{ if(catCol>=0 && String(r[catCol]||"").trim()) cat=normCategory(r[catCol]);
    const name=cleanCell(r[pc]); if(!name) return;
    out.push({name, category:cat, description:dc>=0?cleanCell(r[dc]):"", stakeholders:sc>=0?cleanCell(r[sc]):"", corpDev:cc>=0?cleanCell(r[cc]).replace(/\s*\/\s*/g," / "):"", update:uc>=0?cleanCell(r[uc]):"", order:i}); });
  return {rows:out, headDate, hasCategory:catCol>=0};
}

      <div class="tbl-wrap"><table><thead><tr><th>Category</th><th>Project</th><th>Status</th><th>Update</th></tr></thead><tbody>${p.current.map(x=>`<tr><td class="t2">${esc(CAT_SHORT[x.category]||NO_CAT)}</td><td>${esc(x.name)}</td><td>${statusPill(x.status)}</td><td><div class="prose clamp t2">${esc(x.update)}</div></td></tr>`).join("")}</tbody></table></div>`:""}

}
async function parseWorkbook(file){
  await loadScript(XLSX_SRC,"Excel");
  const wb=window.XLSX.read(await file.arrayBuffer(),{type:"array"});
  const have=new Set(S.projects.map(p=>p.name.trim().toLowerCase()));
  const res={current:[], old:[], meetings:[], skipped:0};
  for(const sn of wb.SheetNames){
    const rows=window.XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1, defval:"", raw:false});
    const ps=parseSheet(rows); if(!ps||!ps.rows.length) continue;
    const lower=sn.trim().toLowerCase(), sheetDate=dateFrom(sn.replace(/\s/g,""))||"";
    if(/^current/.test(lower)){ res.currentDate=ps.headDate;
      for(const r of ps.rows){ if(have.has(r.name.toLowerCase())){ res.skipped++; continue; } res.current.push({...r, status:openStatusFrom(r.update)}); }
      if(ps.headDate) res.meetings.push({date:ps.headDate, rows:ps.rows.map(r=>({...r, status:openStatusFrom(r.update)})), fromCurrent:true}); }
    else if(/old/.test(lower)){
      for(const r of ps.rows){ if(have.has(r.name.toLowerCase()) && S.projects.some(p=>p.name.toLowerCase()===r.name.toLowerCase()&&!isOpen(p))){ res.skipped++; continue; } res.old.push({...r, status:closedStatusFrom(r.update)}); } }
    else if(sheetDate||ps.headDate){ const date=ps.headDate||sheetDate; if(!res.meetings.some(m=>m.date===date)) res.meetings.push({date, rows:ps.rows.map(r=>({...r, status:openStatusFrom(r.update)}))}); }
  }
  res.meetings.sort((a,b)=>a.date.localeCompare(b.date));
  return res;
}
async function importWorkbook(){

      await S.db.collection("projects").doc(id).set({name:r.name, category:r.category, quarter:"", status:r.status, stage:"", description:r.description, stakeholders:r.stakeholders, corpDev:r.corpDev,
        update:r.update, updateDate:p.currentDate||"", links:[], order:r.order, categorySource:r.category?"import":"", createdAt:Date.now(), createdBy:S.meId||"", ...m},{quiet:true}); n++; }
    for(const r of p.old){
      await S.db.collection("projects").doc("p"+uid()).set({name:r.name, category:r.category||"", quarter:"", status:r.status, stage:"", description:r.description, stakeholders:r.stakeholders, corpDev:r.corpDev,
        update:r.update, updateDate:"", closedAt:"", links:[], order:r.order, categorySource:r.category?"import":"", createdAt:Date.now(), createdBy:S.meId||"", ...m},{quiet:true}); n++; }
    for(const mt of p.meetings){ const id="m"+mt.date; if(S.meetings.some(x=>x.id===id)) continue;
      await S.db.collection("meetings").doc(id).set({date:mt.date, title:"Weekly meeting", source:"import", summary:"",
        snapshot:mt.rows.map(r=>({id:ids[r.name.toLowerCase()]||(S.projects.find(x=>x.name.toLowerCase()===r.name.toLowerCase())||{}).id||"", name:r.name, category:r.category, quarter:"", status:r.status, stage:"", description:r.description, stakeholders:r.stakeholders, corpDev:r.corpDev, update:r.update})),

/* ---------- data: Supabase tables (id text, doc jsonb) ---------- */
async function refetch(table){
  const {data, error}=await S.sb.from(table).select("id,doc,updated_at,updated_by");
  if(error){ if(!S.loaded[table]) toast("Couldn't load the tracker: "+error.message); return; }
  const rows=(data||[]).map(r=>({...(r.doc||{}), id:r.id, _v:r.updated_at, _by:r.updated_by}));
  if(table==="todos"){ S.reminders=rows.filter(r=>r.kind==="reminder"); S.developments=rows.filter(r=>r.kind==="development"); S.events=rows.filter(r=>r.kind==="event"); S.todos=rows.filter(r=>!["reminder","development","event"].includes(r.kind)); } else S[table]=rows;
  if(table==="projects") S.projects.forEach(p=>{ if(!STATUSES.includes(p.status)) p.status="Active"; });
  S.loaded[table]=true; if(TABLES.every(t=>S.loaded[t])) clearTimeout(startData.timer);
  if(table==="projects" && S.changes && !S.changes.loading) S.changes=null;
  if(S.drawer && S.drawer.kind==="meeting") S.drawer.rendered=false;
  render();
  if(S.pendingRoute && S.loaded[S.pendingRoute.kind+"s"]) openRoute(S.pendingRoute);
}
const refetchSoon = (()=>{ const t={}; return table=>{ clearTimeout(t[table]); t[table]=setTimeout(()=>refetch(table),300); }; })();
async function loadProfiles(){ const {data}=await S.sb.from("profiles").select("id,display_name,username,initials"); (data||[]).forEach(p=>{ S.profiles[p.id]={name:p.display_name, username:p.username||"", initials:p.initials||""}; }); }
async function loadSettings(){ try{ const {data,error}=await S.sb.from("settings").select("id,doc"); if(!error) S.settings=Object.fromEntries((data||[]).map(r=>[r.id,r.doc||{}])); }catch{} }
function startData(){
  if(S.started) return; S.started=true;
  startData.timer=setTimeout(()=>{ S.stale=true; render(); }, 10000);
  loadProfiles().then(render); loadSettings();
  TABLES.forEach(refetch);
  let ch=S.sb.channel("corpdev-tracker");
  TABLES.forEach(t=>{ ch=ch.on("postgres_changes",{event:"*",schema:"public",table:t},()=>refetchSoon(t)); });
  S.channel=ch.subscribe();
}
function stopData(){ if(S.channel){ S.sb.removeChannel(S.channel); S.channel=null; } S.hist={}; S.changes=null; S.started=false; TABLES.forEach(t=>{ S[t]=[]; S.loaded[t]=false; }); }

async function onSignedIn(session){
  S.meId=session.user.id;

async function doLogin(){
  if(S.loginBusy) return;
  const u=val("li_user"), pw=document.getElementById("li_pw")?.value||"";
  if(!u||!pw){ S.loginErr="Enter your username and password."; render(); return; }
  S.loginBusy=true; S.loginErr=""; render();
  const {data, error}=await S.sb.auth.signInWithPassword({email:toEmail(u), password:pw});
  S.loginBusy=false;
  if(error || !data.session){
    const m=(error&&error.message)||"No session returned";
    S.loginErr = /rate|too many/i.test(m) ? "Too many attempts. Wait a few minutes and try again."
      : (error && (error.code==="invalid_credentials" || /invalid login credentials/i.test(m))) ? "That username and password don't match. Check them, or ask the tracker owner to reset your password."
      : "Sign-in failed: "+m+". The site's Supabase settings may be wrong; tell the tracker owner.";
    render(); const f=document.getElementById("li_pw"); if(f){ f.value=""; f.focus(); } return;
  }
  await onSignedIn(data.session);
}
async function signOut(){ try{ await S.sb.auth.signOut(); }catch{} stopData(); S.session=null; S.drawer=null; document.getElementById("whoDot").hidden=true; history.replaceState(null,"",location.pathname); render(); }
function loginHTML(){
  const wrap = inner => `<div class="login" role="region" aria-label="Sign in">${inner}</div>`;
  if(S.configMissing) return wrap(`<h2>Not connected yet</h2><p>This site has no database settings. Add the SUPABASE_URL and SUPABASE_PUBLISHABLE_KEY repository variables and redeploy (see the README).</p>`);
  if(!S.authChecked) return wrap(`<h2>Corp Dev tracker</h2><p>Loading…</p>`);
  return wrap(`<div class="kicker">Corporate development</div><h2>Sign in to the project tracker</h2>
    <form id="loginForm" style="display:flex;flex-direction:column;gap:12px" novalidate>
      <label class="f">Username<input type="text" id="li_user" autocomplete="username" autocapitalize="none" spellcheck="false"></label>
      <label class="f">Password<input type="password" id="li_pw" autocomplete="current-password"></label>
      ${S.loginErr?`<p class="err" role="alert">${esc(S.loginErr)}</p>`:""}
      <div class="inline"><button class="btn primary" ${S.loginBusy?"disabled":""}>${S.loginBusy?"Signing in…":"Sign in"}</button></div>
    </form><p class="source">Forgot your password? Ask the tracker owner to reset it.</p>`);
}
async function boot(){
  route();
  if(!CFG.supabaseUrl || !CFG.supabaseAnonKey || !window.supabase){ S.configMissing=true; render(); return; }
  S.sb=window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey);
  S.db=makeDb(S.sb);
  const {data:{session}}=await S.sb.auth.getSession();
  S.authChecked=true;
  if(session) await onSignedIn(session); else render();
  S.sb.auth.onAuthStateChange(ev=>{ if(ev==="SIGNED_OUT" && S.session){ stopData(); S.session=null; S.loginErr="You were signed out. Sign in again."; render(); } });
}
boot();
</script>
