name: Tests

# Runs every test suite on each pull request (and on pushes to main), so a change that breaks the site
# or a Supabase function shows a red check before it is merged and published.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Playwright's own image already has Chromium and its system libraries (installing them takes ~10 minutes).
    # Keep its version in step with "playwright" in package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@v5

      - name: Install packages
        run: |
          apt-get update -qq && apt-get install -y -qq unzip >/dev/null   # for the Deno installer
          npm ci

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.5.x

      - name: Run the tests
        run: npm test

      - name: Keep screenshots and exports when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: tests/out/
          retention-days: 7
